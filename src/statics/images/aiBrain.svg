<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="200" cy="150" r="110" fill="url(#glowGrad)" opacity="0.25" filter="url(#aiGlow)" />

  <!-- Neural Mesh Connections -->
  <g stroke="url(#aiGrad)" stroke-width="2" opacity="0.65" stroke-dasharray="4 2">
    <line x1="200" y1="60" x2="140" y2="100" />
    <line x1="200" y1="60" x2="260" y2="100" />
    <line x1="140" y1="100" x2="110" y2="160" />
    <line x1="140" y1="100" x2="190" y2="145" />
    <line x1="260" y1="100" x2="290" y2="160" />
    <line x1="260" y1="100" x2="210" y2="145" />
    <line x1="190" y1="145" x2="210" y2="145" />
    <line x1="110" y1="160" x2="145" y2="225" />
    <line x1="190" y1="145" x2="175" y2="215" />
    <line x1="210" y1="145" x2="225" y2="215" />
    <line x1="290" y1="160" x2="255" y2="225" />
    <line x1="145" y1="225" x2="200" y2="265" />
    <line x1="255" y1="225" x2="200" y2="265" />
    <line x1="175" y1="215" x2="200" y2="265" />
    <line x1="225" y1="215" x2="200" y2="265" />
  </g>

  <!-- Left Hemisphere Brain Lobes -->
  <path d="M190,55 C160,55 130,70 120,95 C105,100 95,120 95,145 C95,160 100,175 110,185 C105,195 110,215 125,225 C140,235 165,245 190,265" 
        fill="none" stroke="url(#aiGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Right Hemisphere Brain Lobes -->
  <path d="M210,55 C240,55 270,70 280,95 C295,100 305,120 305,145 C305,160 300,175 290,185 C295,195 290,215 275,225 C260,235 235,245 210,265" 
        fill="none" stroke="url(#aiGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Central Processing Core -->
  <circle cx="200" cy="145" r="16" fill="#1e1e38" stroke="url(#aiGrad)" stroke-width="3" />
  <circle cx="200" cy="145" r="8" fill="#38bdf8" filter="url(#aiGlow)" />

  <!-- Synaptic Nodes -->
  <circle cx="200" cy="60" r="6" fill="#60a5fa" />
  <circle cx="140" cy="100" r="7" fill="#818cf8" />
  <circle cx="260" cy="100" r="7" fill="#818cf8" />
  <circle cx="110" cy="160" r="7" fill="#c084fc" />
  <circle cx="290" cy="160" r="7" fill="#c084fc" />
  <circle cx="190" cy="145" r="5" fill="#38bdf8" />
  <circle cx="210" cy="145" r="5" fill="#38bdf8" />
  <circle cx="145" cy="225" r="6" fill="#f472b6" />
  <circle cx="255" cy="225" r="6" fill="#f472b6" />
  <circle cx="175" cy="215" r="5" fill="#a78bfa" />
  <circle cx="225" cy="215" r="5" fill="#a78bfa" />
  <circle cx="200" cy="265" r="7" fill="#ec4899" />
</svg>
